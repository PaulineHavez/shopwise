<mat-toolbar color="primary">
  <div class="title-section">
    <h1>Shopwise</h1>
    <span class="city-name">Paris</span>
  </div>

  <span class="spacer"></span>

  <div class="login-section">

    <button mat-stroked-button class="btn-pro" (click)="openProSpaceLoginForm()">
      <mat-icon>store</mat-icon>
      <span class="btn-label">Espace Pro</span>
    </button>

    <button mat-button (click)="openCustomerSpaceLoginForm()">
      <mat-icon>account_circle</mat-icon>
      <span class="btn-label">Mon compte</span>
    </button>

  </div>

</mat-toolbar>
