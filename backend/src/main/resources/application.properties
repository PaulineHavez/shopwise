spring.application.name=backend

# Check if the entity matches the table in database
# Do not update or create a schema
spring.jpa.hibernate.ddl-auto=validate

# Run data.sql at every startup (idempotent — uses ON CONFLICT DO NOTHING)
spring.sql.init.mode=always
# Ensure data.sql runs after Hibernate validation
spring.jpa.defer-datasource-initialization=true
