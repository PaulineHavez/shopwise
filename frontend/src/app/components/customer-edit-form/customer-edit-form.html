<div class="dialog-container">

  <div class="dialog-header">
    <div class="logo-badge">
      <mat-icon>storefront</mat-icon>
    </div>
    <div>
      <h2>Mettre à jour une fiche client</h2>
    </div>
  </div>

  <mat-dialog-content>

    <!-- Étape 1 : Recherche par email -->
    <div class="search-section">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Rechercher un client par e-mail</mat-label>
        <input
          matInput
          type="email"
          [(ngModel)]="searchEmail"
          name="searchEmail"
          placeholder="contact@exemple.fr"
        />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        (click)="onSearch()"
        [disabled]="!searchEmail || isSearching"
        class="search-btn"
      >
        <mat-spinner *ngIf="isSearching" diameter="18"></mat-spinner>
        <span *ngIf="!isSearching">Rechercher</span>
      </button>

      <span *ngIf="searchError" class="error-msg">{{ searchError }}</span>
    </div>

    <!-- Étape 2 : Formulaire affiché uniquement si client trouvé -->
    <form *ngIf="customerFound" (ngSubmit)="onSubmit()" id="customerEditForm">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Nom</mat-label>
        <input matInput type="text" [(ngModel)]="name" name="name" placeholder="Nom du client" required />
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field">
        <mat-label>Numéro de téléphone</mat-label>
        <input matInput type="text" [(ngModel)]="phoneNumber" name="phoneNumber" placeholder="06 ** ** ** **" required />
        <mat-icon matPrefix>phone</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field">
        <mat-label>Adresse e-mail</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" placeholder="contact@moncommerce.fr" required />
        <mat-icon matPrefix>mail_outline</mat-icon>
        <span *ngIf="emailError">{{ emailError }}</span>
      </mat-form-field>
    </form>

  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button (click)="onClose()">Annuler</button>
    <button
      *ngIf="customerFound"
      mat-flat-button
      color="primary"
      form="customerEditForm"
      type="submit"
      [disabled]="!email || !name || !phoneNumber || isLoading"
      class="submit-btn"
    >
      <mat-spinner *ngIf="isLoading" diameter="18"></mat-spinner>
      <span *ngIf="!isLoading">Mettre à jour</span>
    </button>
  </mat-dialog-actions>

</div>
