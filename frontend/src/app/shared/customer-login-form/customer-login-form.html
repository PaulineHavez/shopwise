<div class="dialog-container">

  <div class="dialog-header">
    <div class="logo-badge">
      <mat-icon>face</mat-icon>
    </div>
    <div>
      <h2 mat-dialog-title>Espace Client</h2>
      <p>Connectez-vous pour accéder à votre tableau de bord</p>
    </div>
  </div>

  <mat-dialog-content>
    <form (ngSubmit)="onSubmit()" id="loginForm">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Adresse e-mail</mat-label>
        <input
          matInput
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="contact@moncommerce.fr"
          required
        />
        <mat-icon matPrefix>mail_outline</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="field">
        <mat-label>Mot de passe</mat-label>
        <input
          matInput
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="mot de passe"
          required
        />
        <mat-icon matPrefix>password</mat-icon>
      </mat-form-field>

      <p>
        Pas encore de compte ?
        <button type="button" (click)="openRegisterDialog()">
          Inscris-toi ici
        </button>
      </p>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button (click)="onClose()">Annuler</button>
    <button
      mat-flat-button
      color="primary"
      form="loginForm"
      type="submit"
      [disabled]="!email || isLoading"
      class="submit-btn"
    >
      <mat-spinner *ngIf="isLoading" diameter="18"></mat-spinner>
      <span *ngIf="!isLoading">Se connecter</span>
    </button>
  </mat-dialog-actions>

</div>
